name: Update v0.4.0 dependency lockfile
on:
  push:
    branches:
      - feature/v0.4.0-auth-cloud-library
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'hoangnguyen244-aerastro/3d-web-platform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate verified npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile to feature branch only
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(v040): lock Supabase JavaScript SDK dependencies"
          git push origin HEAD:feature/v0.4.0-auth-cloud-library
